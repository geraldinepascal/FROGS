		<script type="text/javascript">
			
			var pieChart_Clusters;
			var pieChart_Abundance;
			var pieChart_Clusters_options;
			var pieChart_Abundance_options;
			var treeChart;
			var treeChart_options;

			function updateCharts(CURRENT_THEME) {
				pieChart_Clusters = recreateChart(pieChart_Clusters, "nb-filtered", pieChart_Clusters_options, CURRENT_THEME, 600);
				pieChart_Abundance = recreateChart(pieChart_Abundance, "abundance-filtered", pieChart_Abundance_options, CURRENT_THEME, 600);
				if(treeChart_options) treeChart = recreateChart(treeChart, "boxplot-container", treeChart_options, CURRENT_THEME, 600);
			}
			/**
			 Data from HTML
			*/
			var frogs_version = ###FROGS_VERSION### ;
			var frogs_tool = ###FROGS_TOOL### ;
			
			// var summary = {"asv_removed": 4, "abundance_removed": 22025, "abundance_kept": 233756, "asv_kept": 48} ;	
			var summary = ###SUMMARY### ;
			// var removed_details_categories = ["Taxonomic Information", "Abundance Number", "% with abundance total", "Sequence length"] ;
			var removed_details_categories = ###REMOVED_DETAILS_CATEGORIES### ;
			
			var removed_details_data = ###REMOVED_DETAILS_DATA### ;
			/*var removed_details_data = [
			 	{"data": ["k__Bacteria;p__Tenericutes;c__Mollicutes;o__Mycoplasmatales;f__Mycoplasmataceae;g__Candidatus Lumbricincola;s__NA", 200, 0.07819189071901353, 558], "name": "asv_01778"}, 
			 	{"data": ["k__Bacteria;p__Firmicutes;c__Bacilli;o__Lactobacillales;f__Carnobacteriaceae;g__Carnobacterium;s__Funditum", 459, 0.17945038920013606, 506], "name": "asv_00186"}, 
			 	{"data": ["k__Bacteria;p__Proteobacteria;c__Gammaproteobacteria;o__Vibrionales;f__Vibrionaceae;g__Photobacterium;s__Aquimaris", 1044, 0.4081616695532506, 538], "name": "asv_01097"}, 
			 	{"data": ["k__Bacteria;p__CK-1C4-19;c__NA;o__NA;f__NA;g__NA;s__NA", 20322, 7.9450780159589645, 501], "name": "asv_01918"}
			] ;*/

			var newick = '###NEWICK###' ;
			
			var summaryLoad = function(){
				// Remove alert
				$('#js-alert').remove();
				document.getElementById("logo").src = "data:image/png;base64," + logoBase64;
				$('#content').removeClass("hidden");
				
				/*var nb_asv = [
					['In Tree', summary['Kept']],
					['Out of Tree', summary['Removed']]
				];
				
				var nb_abundance = [
  					['In Tree', summary['Kept']],
  					['Out of Tree', summary['Removed']]
  				];*/

				pieChart_Clusters_options = pieOption(summary['asv_kept'], summary['asv_removed'], "Kept", "Removed","ASVs","ASVs")
				pieChart_Abundance_options = pieOption(summary['abundance_kept'], summary['abundance_removed'], "Kept", "Removed","Abundance","Sequences");
				// Initialisation des graphiques avec ECharts
				pieChart_Clusters = echarts.init(document.getElementById("nb-filtered"),CURRENT_THEME,{renderer: 'svg', height:600})
				pieChart_Abundance = echarts.init(document.getElementById("abundance-filtered"),CURRENT_THEME,{renderer: 'svg', height:600})
				pieChart_Clusters.setOption(pieChart_Clusters_options);
				pieChart_Abundance.setOption(pieChart_Abundance_options);
			}

			function draw_tree(id, newick, color1, color2){
					//// Construct tree object
					var tree = Phylocanvas.createTree('phylocanvas');
					tree.setTreeType('rectangular');
					tree.alignLabels = true;
					tree.setNodeSize(12);
					tree.setTextSize(12);
					tree.lineWidth = 1.5;
					tree.branchColour = color1;
					tree.selectedColour = color2;
					tree.load(newick)
					tree.backColour = true;
					tree.draw();
			}

			/* Surcharge de update_theme pour integrer la creation de l'arbre, afin de pouvoir changer les couleurs */
			function update_theme(val) {
				var cfg = themeConfigs[val];
				if (!cfg) return;

				// Appliquer les variables CSS
				Object.entries(cfg.vars).forEach(([key, value]) => {
					//document.documentElement.style.setProperty(key, value);
					document.querySelector(':root').style.setProperty(key, value);

				});
				CURRENT_THEME = val;
				// Recharger les graphiques avec le thème ECharts
				// Cette fonction doit être définie dans le template HTML
				updateCharts(CURRENT_THEME);

				treeContainer = document.getElementById('phylocanvas');
				if(treeContainer){
					$("#phylocanvas").empty();
					draw_tree('phylocanvas', newick, getCssVar("--frogsColor"), getCssVar("--frogsColor2"))
				}
			}

	

			$(function () {
				
				// Resize charts on window resize
				window.addEventListener('resize', () => {
					[pieChart_Clusters, pieChart_Abundance].forEach(chart => {
						if (chart) chart.resize();
					});
				});
				document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(tab => {
					tab.addEventListener('shown.bs.tab', function (e) {
						setTimeout(() => {
						if (pieChart_Clusters) pieChart_Clusters.resize();
						if (pieChart_Abundance) pieChart_Abundance.resize();
						//if (treeChart) treeChart.resize();
						}, 200);
					});
				});

				$("#report-title").html("Tree report <i><small class='text-muted'>(" + frogs_tool + ", v" + frogs_version + ")<small></i>");

				// Charger le résumé par défaut
				summaryLoad();

				// Default theme
				update_theme(DEFAULT_THEME);
				select = document.getElementById("themechoice");
				select.options[1].disabled = true 
				
				// Display failed ASVs table
				if(removed_details_data.length>0){
					var table_categories = removed_details_categories.slice() ;
					table_categories.unshift( "ASV Name" );
					var table_series = new Array();
					for( var spl_idx = 0 ; spl_idx < removed_details_data.length ; spl_idx++ ){
						var nb_by_step = removed_details_data[spl_idx]['data'].slice() ;
						nb_by_step.unshift( removed_details_data[spl_idx]['name'] );
						table_series.push( nb_by_step );
					};

					var html_table = table("Table of ASVs not included in tree", table_categories, table_series);

					$('#ASVs-fail').html(html_table);
					$('#ASVs-fail table').prop( 'id', 'filters-table' );
					$('#filters-table').bootstrapTable();

				}else{
					$("#ASV-fail").remove();
				}
				
			});

			
		</script>
